name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build MCP server
        run: npm run build

      - name: Build hosted HTTP app
        run: npm run build:hosted

      - name: Run unit tests
        run: npm test

      - name: Smoke test (tools/list)
        run: |
          response=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node packages/mcp/dist/index.js 2>/dev/null)
          echo "$response"
          echo "$response" | grep -q "trustlists_search"
          echo "$response" | grep -q "trustlists_lookup"
          echo "$response" | grep -q "trustlists_browse"
          echo "$response" | grep -q "trustlists_audit_dependencies"
